[package]
name = "a11y-core"
version = "0.1.0"
edition = "2024"
description = "Reusable accessibility rules and search core for AccessiGuide"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[[bench]]
name = "search"
harness = false
